services:
  - type: keyvalue
    name: jimma-ics-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: jimma-ics-api
    runtime: docker
    plan: starter
    dockerfilePath: ./jimma_ics-main-main/jimma-ics-backend/Dockerfile
    dockerContext: ./jimma_ics-main-main/jimma-ics-backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        value: https://jimma-redesigned.vercel.app
      - key: WEB_APP_URL
        value: https://jimma-redesigned.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jimma-ics-redis
          property: connectionString
      - key: SEED_SUPER_ADMIN_EMAIL
        value: admin@jimmaislamiccouncil.org
      - key: SEED_SUPER_ADMIN_PASSWORD
        sync: false
